# GammaOS Core extlinux.conf — NGP45HT (ported from RG52 Mini v1.9)
# Changes vs RG52: FDT -> rk3562-ngp45ht.dtb ; fbcon=rotate:1 dropped (NGP45HT panel is 1024x768 landscape)
DEFAULT GammaOS
TIMEOUT 10

LABEL GammaOS
    MENU LABEL GammaOS Core (NGP45HT)
    LINUX /Image
    FDT /rk3562-ngp45ht.dtb
    INITRD /initrd.zst
    APPEND console=ttyFIQ0 firmware_class.path=/vendor/lib/firmware init=/init rootwait ro loop.max_part=7 8250.nr_uarts=10 storagemedia=sd androidboot.hardware=rk30board androidboot.boot_devices=ff880000.mmc androidboot.storagemedia=sd androidboot.mode=normal androidboot.force_normal_boot=1 androidboot.veritymode=disabled printk.devkmsg=on loglevel=7 androidboot.selinux=permissive rodata=on dhash_entries=131072 ihash_entries=65536
